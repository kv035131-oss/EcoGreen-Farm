{% extends 'shared/base.html' %}

{% block title %}Register - EcoGreen{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 4rem auto; padding: 2rem; background: white; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow);">
    <h2 style="margin-bottom: 1.5rem; text-align: center; color: #065f46;"><i class="fa-solid fa-user-plus"></i> <span>Join EcoGreen</span></h2>
    <form id="standalone-register-form">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Username</label>
            <input type="text" id="reg-username" required style="width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-color);">
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Email</label>
            <input type="email" id="reg-email" required style="width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-color);">
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Phone Number</label>
            <input type="tel" id="reg-phone" required style="width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-color);">
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Account Type</label>
            <select id="reg-role" style="width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-color);">
                <option value="consumer">Consumer</option>
                <option value="farmer">Farmer</option>
            </select>
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Password</label>
            <input type="password" id="reg-password" required style="width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-color);">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
    </form>
</div>
{% endblock %}
