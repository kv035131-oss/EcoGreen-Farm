{% extends 'shared/base.html' %}

{% block title %}Log In - EcoGreen{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto; padding: 2rem; background: white; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow);">
    <h2 style="margin-bottom: 1.5rem; text-align: center; color: #065f46;"><i class="fa-solid fa-leaf"></i> <span>Welcome Back</span></h2>
    <form id="standalone-login-form">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Username</label>
            <input type="text" id="login-username" required style="width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-color);">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Password</label>
            <input type="password" id="login-password" required style="width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid var(--border-color);">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
    </form>
</div>
{% endblock %}
